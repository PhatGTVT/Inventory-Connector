<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connector Inventory | Quản lý Kho Linh Kiện Connector</title>
  <meta name="description"
    content="Hệ thống quản lý kho linh kiện connector chuyên nghiệp - tìm kiếm, tra cứu thông số kỹ thuật, yêu cầu xuất kho trực tuyến." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/base.css?v=2.2" />
  <link rel="stylesheet" href="/css/layout.css?v=2.2" />
  <link rel="stylesheet" href="/css/components.css?v=2.2" />
  <style>
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .page-header {
      margin-bottom: 1.5rem;
    }

    .page-header h1 {
      font-size: 1.75rem;
    }

    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .filter-tabs button {
      padding: 0.4rem 1rem;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-tabs button.active {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--accent-primary);
      color: #60a5fa;
    }

    #results-count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-content">
      <a href="/" class="brand-logo" id="nav-logo">
        <div class="logo-icon"><img src="/assets/logo.png" alt="Connector Logo"
            onerror="this.outerHTML='<i class=\'bi bi-plug-fill\'></i>'" /></div>
        <span>Connector</span>
        <span class="brand-badge">Inventory</span>
      </a>

      <div class="search-wrapper">
        <div class="search-bar">
          <i class="bi bi-search search-icon"></i>
          <input type="text" id="global-search" placeholder="Tìm theo mã MPN, DigiKey P/N, tên mô tả..."
            autocomplete="off" />
        </div>
      </div>

      <div class="nav-actions">
        <!-- Admin only links -->
        <a href="/admin-library" class="btn btn-secondary btn-sm admin-only-nav" style="display:none">
          <i class="bi bi-collection"></i> Thư viện
        </a>
        <a href="/admin-approval" class="btn btn-secondary btn-sm admin-only-nav" style="display:none">
          <i class="bi bi-clipboard-check"></i> Duyệt Yêu Cầu
        </a>
        <a href="/admin-manage" class="btn btn-secondary btn-sm admin-only-nav" style="display:none">
          <i class="bi bi-gear"></i> Quản lý Kho
        </a>
        <a href="/admin-users" class="btn btn-secondary btn-sm admin-only-nav" style="display:none">
          <i class="bi bi-people"></i> Người Dùng
        </a>

        <!-- Theme Toggle Button -->
        <button id="theme-toggle-btn" class="btn btn-secondary btn-sm" title="Đổi chế độ Sáng / Tối"
          style="padding:0.35rem 0.65rem;border-radius:var(--radius-full);display:flex;align-items:center;gap:0.35rem">
          <i class="bi bi-sun-fill" id="theme-icon"></i>
        </button>

        <!-- Auth section -->
        <div id="nav-login-section" style="display:flex;gap:0.5rem">
          <button class="btn btn-outline btn-sm" id="open-login-btn">
            <i class="bi bi-person"></i> Đăng nhập
          </button>
        </div>

        <div id="nav-user-section" class="user-profile-badge" style="display:none">
          <div class="user-avatar" id="user-avatar">A</div>
          <div class="user-info">
            <span class="name" id="user-fullname">Admin</span>
            <span class="role-tag" id="user-role-tag">Admin</span>
          </div>
          <button id="logout-btn" class="btn btn-sm"
            style="background:transparent;color:var(--text-dim);font-size:0.9rem;padding:0.2rem 0.4rem"
            title="Đăng xuất">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->

    <!-- Catalog Layout -->
    <div class="catalog-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-title">
            <span><i class="bi bi-grid-fill"></i> Danh Mục</span>
          </div>
          <ul class="category-list" id="category-list">
            <li class="category-item" style="color:var(--text-dim)">Đang tải...</li>
          </ul>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">
            <span><i class="bi bi-sliders"></i> Bộ Lọc</span>
            <button id="btn-reset-filters" class="btn btn-sm"
              style="font-size:0.78rem;padding:0.25rem 0.65rem;background:rgba(255,255,255,0.05);color:var(--text-muted);border:1px solid var(--border-color)">Đặt
              lại</button>
          </div>

          <div class="filter-group">
            <label class="filter-label">Nhà sản xuất</label>
            <select class="filter-select" id="filter-manufacturer">
              <option value="">Tất cả</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Fastening Type</label>
            <select class="filter-select" id="filter-fastening">
              <option value="">Tất cả</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Number of Positions</label>
            <select class="filter-select" id="filter-positions">
              <option value="">Tất cả</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Contact Type</label>
            <select class="filter-select" id="filter-contact">
              <option value="">Tất cả</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Housing Color</label>
            <select class="filter-select" id="filter-color">
              <option value="">Tất cả</option>
            </select>
          </div>
        </div>
      </aside>

      <!-- Product Grid -->
      <main>
        <div class="page-header">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem">
            <h1>Danh Mục Connector</h1>
            <span id="results-count" style="font-size:0.9rem;color:var(--text-muted)"></span>
          </div>
        </div>
        <div class="product-grid" id="product-grid">
          <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-muted)">
            <div class="spinner"></div>
            <p style="margin-top:1rem">Đang tải linh kiện...</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-content" style="max-width:400px">
      <div class="modal-header">
        <h3><i class="bi bi-person-lock"></i> Đăng Nhập Hệ Thống</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="login-form">
          <div class="filter-group">
            <label class="filter-label">Tên đăng nhập</label>
            <input type="text" id="login-username" class="filter-select" placeholder="admin / user" required
              autocomplete="username" />
          </div>
          <div class="filter-group" style="margin-top:1rem">
            <label class="filter-label">Mật khẩu</label>
            <input type="password" id="login-password" class="filter-select" placeholder="admin123 / user123" required
              autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.5rem;padding:0.7rem">
            <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
          </button>
        </form>
        <p style="text-align:center;color:var(--text-muted);font-size:0.8rem;margin-top:1.25rem">
          Tài khoản mặc định: <code style="color:var(--accent-cyan)">admin</code> / <code
            style="color:var(--accent-cyan)">admin123</code>
        </p>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/catalog.js"></script>
</body>

</html>
